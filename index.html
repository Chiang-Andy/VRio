<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Question For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f0ff 0%, #ffd1dc 35%, #ffb6c1 65%, #a8d4ff 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            padding: 20px;
        }

        html {
            height: -webkit-fill-available;
        }

        .container {
            text-align: center;
            padding: 30px 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .heart-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #c44569;
            font-size: 1.8rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            min-height: 80px;
            align-items: center;
            margin-top: 20px;
        }


        .btn {
            padding: 16px 36px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b6b, #c44569);
            color: white;
            box-shadow: 0 8px 30px rgba(196, 69, 105, 0.4);
            padding: 30px 70px;
            font-size: 2rem;
            font-weight: bold;
        }

        .btn-yes:hover, .btn-yes:active, .btn-yes.pressed {
            transform: scale(1.15);
            box-shadow: 0 6px 25px rgba(196, 69, 105, 0.45);
        }

        @media screen and (max-width: 768px) {
            .btn-yes {
                padding: 20px 45px !important;
                font-size: 1.5rem !important;
            }
        }

        .btn-no {
            background: #ddd;
            color: #666;
            position: fixed;
            transition: all 0.3s ease;
            white-space: nowrap;
            z-index: 50;
        }

        .success-message {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .success-message h1 {
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .success-message p {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .roses {
            font-size: 30px;
            margin-top: 10px;
            animation: sway 2s ease-in-out infinite;
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .music-btn:hover {
            transform: scale(1.1);
        }

        .music-btn.playing {
            animation: pulse-music 1s ease-in-out infinite;
        }

        @keyframes pulse-music {
            0%, 100% { box-shadow: 0 4px 15px rgba(196, 69, 105, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(196, 69, 105, 0.6); }
        }

        .song-title {
            position: fixed;
            bottom: 25px;
            right: 80px;
            font-size: 12px;
            color: #666;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 200;
        }

        .song-title.show {
            opacity: 1;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Floating hearts background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
        }

        .floating-text {
            position: absolute;
            font-size: 16px;
            color: #c44569;
            opacity: 0;
            white-space: nowrap;
            font-family: 'Georgia', serif;
            font-style: italic;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
            animation: floatText 8s ease-in-out infinite;
        }

        @keyframes floatText {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateX(calc(100vw + 100%));
                opacity: 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .heart-icon {
                font-size: 50px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 14px 32px;
                font-size: 1rem;
            }

            .success-message h1 {
                font-size: 1.4rem;
            }

            .success-message p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container">
        <div id="question">
            <div class="heart-icon">🩵💕</div>
            <h1>Rio, will you be my Valentine?</h1>
            <div class="roses">🌹🌹🌹</div>
            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn">Yes!</button>
            </div>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>

        <div class="success-message" id="success">
            <div class="heart-icon">💖🩵</div>
            <h1>I love you Rio, you make me happy.</h1>
            <div class="roses">🌹🌹🌹</div>
            <p>Let's enjoy a wonderful life together</p>
        </div>
    </div>

    <div class="confetti" id="confetti"></div>

    <audio id="bgMusic" loop>
        <source src="best-part.mp3" type="audio/mpeg">
    </audio>
    <div class="song-title" id="songTitle">Best Part - Daniel Caesar</div>
    <button class="music-btn" id="musicBtn">🎵</button>

    <script>
        // Create floating hearts
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '❤️', '🩵', '🩵', '🌹', '🌹', '🌹'];
            const numHearts = window.innerWidth < 480 ? 12 : 20;

            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 15 + 12) + 'px';
                container.appendChild(heart);
            }
        }

        // No button runs away
        const noBtn = document.getElementById('noBtn');
        let noClickCount = 0;
        const messages = [
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Pretty please?",
            "With cherry on top?",
            "I'll be sad...",
            "Just say yes!",
            "Come on!"
        ];

        function moveButton() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 20;

            // Get Yes button position to avoid overlap
            const yesRect = yesBtn.getBoundingClientRect();

            let randomX, randomY;
            let attempts = 0;

            do {
                randomX = padding + Math.random() * (window.innerWidth - btnWidth - padding * 2);
                randomY = padding + Math.random() * (window.innerHeight - btnHeight - padding * 2);
                attempts++;
            } while (
                attempts < 50 &&
                randomX < yesRect.right + 20 &&
                randomX + btnWidth > yesRect.left - 20 &&
                randomY < yesRect.bottom + 20 &&
                randomY + btnHeight > yesRect.top - 20
            );

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Position No button properly on load
        function initNoButton() {
            const yesRect = yesBtn.getBoundingClientRect();
            const btnWidth = noBtn.offsetWidth;

            // Position to the right of Yes button
            let leftPos = yesRect.right + 20;

            // If it would go off screen, position it below the Yes button to the right
            if (leftPos + btnWidth > window.innerWidth - 20) {
                leftPos = yesRect.left + yesRect.width / 2;
                noBtn.style.top = (yesRect.bottom + 15) + 'px';
            } else {
                noBtn.style.top = (yesRect.top + yesRect.height / 2 - noBtn.offsetHeight / 2) + 'px';
            }

            noBtn.style.left = leftPos + 'px';
        }

        setTimeout(initNoButton, 100);

        function handleNoInteraction(e) {
            e.preventDefault();
            // Pick a random message each time
            const randomIndex = Math.floor(Math.random() * messages.length);
            noBtn.textContent = messages[randomIndex];
            moveButton();
        }

        // Desktop hover
        noBtn.addEventListener('mouseenter', moveButton);

        // Both desktop click and mobile tap
        noBtn.addEventListener('click', handleNoInteraction);

        // Prevent default touch behavior and handle touch
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleNoInteraction(e);
        }, { passive: false });

        // Yes button action
        function sayYes() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            createConfetti();

            // Vibrate on mobile if supported
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 100]);
            }
        }

        // Create confetti
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#ff6b6b', '#c44569', '#ff91a4', '#ffd1dc', '#ffb6c1', '#ff69b4', '#87ceeb', '#b0e0e6', '#add8e6', '#e53935', '#c62828'];
            const numPieces = window.innerWidth < 480 ? 60 : 100;

            for (let i = 0; i < numPieces; i++) {
                setTimeout(() => {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    piece.style.animationDelay = Math.random() * 0.5 + 's';
                    container.appendChild(piece);

                    setTimeout(() => piece.remove(), 3000);
                }, i * 25);
            }
        }

        // Yes button - works on both desktop and mobile
        const yesBtn = document.getElementById('yesBtn');
        yesBtn.addEventListener('click', sayYes);
        yesBtn.addEventListener('touchstart', function(e) {
            yesBtn.classList.add('pressed');
        });
        yesBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            yesBtn.classList.remove('pressed');
            sayYes();
        });

        // Music player
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const songTitle = document.getElementById('songTitle');
        let isPlaying = false;

        function startMusic() {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    musicBtn.textContent = '🔊';
                    musicBtn.classList.add('playing');
                    songTitle.classList.add('show');
                    setTimeout(() => songTitle.classList.remove('show'), 3000);
                }).catch(() => {
                    // Autoplay blocked, will try on first interaction
                });
            }
        }

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '🎵';
                musicBtn.classList.remove('playing');
                songTitle.classList.remove('show');
                isPlaying = false;
            } else {
                startMusic();
            }
        }

        // Try to autoplay
        startMusic();

        // If autoplay blocked, start on first tap anywhere
        document.addEventListener('touchstart', function initMusic() {
            startMusic();
            document.removeEventListener('touchstart', initMusic);
        }, { once: true });

        document.addEventListener('click', function initMusicClick() {
            startMusic();
            document.removeEventListener('click', initMusicClick);
        }, { once: true });

        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMusic();
        });
        musicBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMusic();
        });

        createFloatingHearts();
        createFloatingTexts();

        // Create floating love messages
        function createFloatingTexts() {
            const container = document.getElementById('floatingHearts');
            const messages = [
                "I love you",
                "You're the one",
                "You're the best",
                "You're my everything",
                "Forever yours",
                "My heart is yours",
                "You make me happy",
                "You're beautiful",
                "Always & forever",
                "You're amazing",
                "My soulmate",
                "You're perfect",
                "I adore you",
                "You're my sunshine",
                "Dream come true",
                "Lucky to have you",
                "You're my world",
                "Crazy about you",
                "Be mine forever",
                "You + Me = ❤️"
            ];

            function addFloatingText() {
                const text = document.createElement('div');
                text.className = 'floating-text';
                text.textContent = messages[Math.floor(Math.random() * messages.length)];
                text.style.top = (10 + Math.random() * 80) + '%';
                text.style.animationDuration = (6 + Math.random() * 4) + 's';
                text.style.fontSize = (14 + Math.random() * 8) + 'px';
                container.appendChild(text);

                setTimeout(() => text.remove(), 10000);
            }

            // Add one immediately, then periodically
            addFloatingText();
            setInterval(addFloatingText, 3000);
        }
    </script>
</body>
</html>
