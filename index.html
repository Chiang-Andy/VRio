<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Question For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f0ff 0%, #ffd1dc 35%, #ffb6c1 65%, #a8d4ff 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            padding: 20px;
        }

        html {
            height: -webkit-fill-available;
        }

        .container {
            text-align: center;
            padding: 30px 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .heart-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #c44569;
            font-size: 1.8rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            min-height: 80px;
            align-items: center;
            margin-top: 20px;
        }

        .btn-no-wrapper {
            position: relative;
            width: 100px;
            height: 50px;
        }

        .btn {
            padding: 16px 36px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b6b, #c44569);
            color: white;
            box-shadow: 0 4px 15px rgba(196, 69, 105, 0.3);
        }

        .btn-yes:hover, .btn-yes:active {
            transform: scale(1.08);
            box-shadow: 0 6px 25px rgba(196, 69, 105, 0.45);
        }

        .btn-no {
            background: #ddd;
            color: #666;
            position: absolute;
            top: 0;
            left: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .success-message {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .success-message h1 {
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .success-message p {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .roses {
            font-size: 30px;
            margin-top: 10px;
            animation: sway 2s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Floating hearts background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .heart-icon {
                font-size: 50px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 14px 32px;
                font-size: 1rem;
            }

            .success-message h1 {
                font-size: 1.4rem;
            }

            .success-message p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container">
        <div id="question">
            <div class="heart-icon">🩵💕</div>
            <h1>Rio, will you be my Valentine?</h1>
            <div class="roses">🌹🌹🌹</div>
            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn">Yes!</button>
                <div class="btn-no-wrapper">
                    <button class="btn btn-no" id="noBtn">No</button>
                </div>
            </div>
        </div>

        <div class="success-message" id="success">
            <div class="heart-icon">💖🩵</div>
            <h1>I love you Rio, you make me happy.</h1>
            <div class="roses">🌹🌹🌹</div>
            <p>Let's enjoy a wonderful life together</p>
        </div>
    </div>

    <div class="confetti" id="confetti"></div>

    <script>
        // Create floating hearts
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '💖', '💗', '💓', '💝', '❤️', '🩵', '🩵', '🌹', '🌹', '🌹'];
            const numHearts = window.innerWidth < 480 ? 12 : 20;

            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 15 + 12) + 'px';
                container.appendChild(heart);
            }
        }

        // No button runs away
        const noBtn = document.getElementById('noBtn');
        const noWrapper = document.querySelector('.btn-no-wrapper');
        let noClickCount = 0;
        const messages = [
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Pretty please?",
            "With cherry on top?",
            "I'll be sad...",
            "Just say yes!",
            "Come on!"
        ];

        function moveButton() {
            const maxX = 150;
            const maxY = 120;

            const randomX = (Math.random() - 0.5) * 2 * maxX;
            const randomY = (Math.random() - 0.5) * 2 * maxY;

            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function handleNoInteraction(e) {
            e.preventDefault();
            // Pick a random message each time
            const randomIndex = Math.floor(Math.random() * messages.length);
            noBtn.textContent = messages[randomIndex];
            moveButton();
        }

        // Desktop hover
        noBtn.addEventListener('mouseenter', moveButton);

        // Both desktop click and mobile tap
        noBtn.addEventListener('click', handleNoInteraction);

        // Prevent default touch behavior and handle touch
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            handleNoInteraction(e);
        }, { passive: false });

        // Yes button action
        function sayYes() {
            document.getElementById('question').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            createConfetti();

            // Vibrate on mobile if supported
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 100]);
            }
        }

        // Create confetti
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#ff6b6b', '#c44569', '#ff91a4', '#ffd1dc', '#ffb6c1', '#ff69b4', '#87ceeb', '#b0e0e6', '#add8e6', '#e53935', '#c62828'];
            const numPieces = window.innerWidth < 480 ? 60 : 100;

            for (let i = 0; i < numPieces; i++) {
                setTimeout(() => {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    piece.style.animationDelay = Math.random() * 0.5 + 's';
                    container.appendChild(piece);

                    setTimeout(() => piece.remove(), 3000);
                }, i * 25);
            }
        }

        // Yes button - works on both desktop and mobile
        const yesBtn = document.getElementById('yesBtn');
        yesBtn.addEventListener('click', sayYes);
        yesBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            sayYes();
        });

        createFloatingHearts();
    </script>
</body>
</html>
